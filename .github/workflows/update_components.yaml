name: "Update component database"
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 11 * * *'
    - cron: '0 19 * * *'
permissions:
  contents: write
concurrency:
  group: update-components-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_and_update:
    name: "Build component database and frontend"
    runs-on: ubuntu-24.04
    environment: github-pages
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip nodejs npm curl wget zip unzip p7zip-full
          sudo pip3 install requests click
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build frontend
        run: |
          cd web
          if [ "$GITHUB_REPOSITORY" = 'yaqwsx/jlcparts-dev' ]; then
            export BASEURL=https://jlcparts-dev.honzamrazek.cz
          else
            export BASEURL=https://yaqwsx.github.io/jlcparts
          fi
          npm install --silent
          NODE_ENV=production PUBLIC_URL=${BASEURL} npm run build
          if [ $GITHUB_REPOSITORY = 'yaqwsx/jlcparts-dev' ]; then
            echo 'jlcparts-dev.honzamrazek.cz' > build/CNAME
          fi
          touch build/.nojekyll
      - name: Build database files
        env: # Or as an environment variable
          LCSC_KEY: ${{ secrets.LCSC_KEY }}
          LCSC_SECRET: ${{ secrets.LCSC_SECRET }}
          JLCPCB_APP_ID: ${{ secrets.JLCPCB_APP_ID }}
          JLCPCB_ACCESS_KEY: ${{ secrets.JLCPCB_ACCESS_KEY }}
          JLCPCB_SECRET_KEY: ${{ secrets.JLCPCB_SECRET_KEY }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -x
          sudo pip3 install -e .

          if [ "$GITHUB_REPOSITORY" = 'yaqwsx/jlcparts-dev' ]; then
            export BASEURL=https://jlcparts-dev.honzamrazek.cz
          else
            export BASEURL=https://yaqwsx.github.io/jlcparts
          fi
          export DATAURL=${BASEURL}/data

          # Download a published file. Returns 1 only when the file does not
          # exist (HTTP 404). Any other failure aborts the job, so a transient
          # error is never mistaken for a missing cache.
          fetch_published() {
            local name="$1" code
            code=$(curl -sS -L --retry 5 --retry-delay 10 --retry-all-errors \
                        -o "${name}" -w '%{http_code}' "${DATAURL}/${name}") || code=000
            case "$code" in
              200) return 0 ;;
              404) rm -f "${name}"; return 1 ;;
              *) echo "Cannot download ${name}: HTTP ${code}"; exit 1 ;;
            esac
          }

          have_cache=0
          if fetch_published cache.zip; then
            have_cache=1
            downloaded_parts=()
            part=1
            while true; do
              if [ "$part" -le 99 ]; then
                suffix=$(printf "%02d" "$part")
              else
                suffix="$part"
              fi
              name="cache.z${suffix}"
              if fetch_published "${name}"; then
                downloaded_parts+=("${name}")
                part=$((part + 1))
                continue
              fi
              break
            done

            7z x cache.zip
            rm -f cache.zip
            if [ ${#downloaded_parts[@]} -gt 0 ]; then
              rm -f "${downloaded_parts[@]}"
            fi
          else
            if [ "$WORKFLOW_EVENT_NAME" != "schedule" ]; then
              echo "No published cache found; only scheduled runs may fetch a fresh database from JLC"
              exit 1
            fi
            echo "No published cache found, bootstrapping a fresh database"
          fi

          if [ -f cache.sqlite3 ]; then
            jlcparts migratecache cache.sqlite3
          fi

          if [ "$WORKFLOW_EVENT_NAME" = "schedule" ]; then
            # A fresh database must start from the beginning of the catalog,
            # so the published checkpoint is only used with a published cache.
            if [ "$have_cache" = 1 ]; then
              fetch_published parts.checkpoint.json || true
            fi

            fetch_seconds=${JLCPARTS_FETCH_SECONDS:-2400}
            lcsc_age=${JLCPARTS_LCSC_AGE:-10000}
            lcsc_limit=${JLCPARTS_LCSC_LIMIT:-1000}
            jlcparts fetchdb --verbose \
                             --checkpoint parts.checkpoint.json \
                             --max-seconds "$fetch_seconds" \
                             --age "$lcsc_age" \
                             --limit "$lcsc_limit" \
                             cache.sqlite3
            jlcparts updatepreferred cache.sqlite3
          else
            rm -f parts.checkpoint.json
          fi

          jlcparts buildtables --jobs 0 \
                               --ignoreoldstock 120 \
                               cache.sqlite3 web/build/data

          if [ -f parts.checkpoint.json ]; then
            cp parts.checkpoint.json web/build/data/parts.checkpoint.json
          fi

          rm -f web/build/data/cache.z*
          zip -s 50m web/build/data/cache.zip cache.sqlite3
      - name: Tar artifact # Artifact are case insensitive, this is workaround
        run: tar -czf web_build.tar.gz web/build/
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web_build
          path: web_build.tar.gz
          retention-days: 14
  deploy:
    name: "Deploy"
    runs-on: ubuntu-24.04
    needs: build_and_update
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout # Required for GH-pages deployment
        uses: actions/checkout@v6
      - name: "Download web"
        uses: actions/download-artifact@v5
        with:
          name: web_build
      - name: Untar artifact
        run: tar -xzf web_build.tar.gz
      - name: Deploy to GH Pages
        uses: JamesIves/github-pages-deploy-action@v4.4.3
        with:
          branch: gh-pages
          folder: web/build
          single-commit: true
